name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, Typecheck, Unit- und Integrationstests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @financeanchor/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Nur nach grünen Tests auf main: Web-App bauen, Migrationen auf die Produktions-D1, Worker deployen.
  # Braucht das Secret CLOUDFLARE_API_TOKEN (Workers + D1 bearbeiten), das Secret
  # CLOUDFLARE_ACCOUNT_ID und die Variable APP_URL (siehe README, „Automatisches Deployment“).
  deploy:
    name: Deployment (Cloudflare)
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      # Ohne Token (noch nicht eingerichtet) wird übersprungen statt fehlzuschlagen
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN fehlt, Deployment übersprungen (siehe README)."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
      - if: env.HAS_TOKEN == 'true'
        uses: pnpm/action-setup@v6
      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: env.HAS_TOKEN == 'true'
        run: pnpm install --frozen-lockfile
      - if: env.HAS_TOKEN == 'true'
        run: pnpm run deploy
        env:
          APP_URL: ${{ vars.APP_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
